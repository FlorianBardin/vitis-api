services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
  adminer:
    image: adminer
    ports:
      - "8088:8080"
    networks:
      - db

networks:
  db:
    driver: bridge

volumes:
  db: